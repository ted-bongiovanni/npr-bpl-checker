<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Next Read</title>
    <style>
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 113, 227, 0.15); }
            50% { box-shadow: 0 0 30px rgba(0, 113, 227, 0.3); }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #f5f5f7;
            --bg-card: rgba(255, 255, 255, 0.72);
            --bg-card-hover: rgba(255, 255, 255, 0.9);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #6e6e73;
            --accent: #0071e3;
            --accent-hover: #0077ED;
            --border: rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-pill: 980px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle top gradient bar */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #06c, #0071e3, #34aadc, #5ac8fa, #34aadc, #0071e3, #06c);
            background-size: 200% 100%;
            animation: shimmer 8s linear infinite;
            z-index: 100;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 60px 24px 40px;
        }

        /* ─── Header ─── */
        header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeIn 0.8s ease-out;
        }

        header h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 1.08;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-tertiary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 19px;
            font-weight: 400;
            line-height: 1.47;
            letter-spacing: 0.012em;
            max-width: 540px;
            margin: 0 auto;
        }

        .audiobook-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            padding: 8px 18px;
            background: rgba(125, 84, 222, 0.08);
            color: #7d54de;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius-pill);
            transition: all 0.25s ease;
        }

        .audiobook-link:hover {
            background: rgba(125, 84, 222, 0.14);
            transform: translateY(-1px);
        }

        /* ─── Filter Bar ─── */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            animation: fadeIn 0.8s ease-out 0.1s both;
        }

        .filter-chip {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-pill);
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .filter-chip:hover {
            background: rgba(0, 0, 0, 0.08);
            color: var(--text-primary);
        }

        .filter-chip.active {
            background: var(--text-primary);
            color: white;
        }

        /* ─── Book Count ─── */
        .book-count {
            text-align: center;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.02em;
            animation: fadeIn 0.8s ease-out 0.15s both;
        }

        /* ─── Book Grid ─── */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 48px;
        }

        @media (max-width: 800px) {
            .book-grid { grid-template-columns: repeat(2, 1fr); }
            header h1 { font-size: 36px; }
            header p { font-size: 17px; }
            .container { padding: 48px 16px 32px; }
        }

        @media (max-width: 500px) {
            .book-grid { grid-template-columns: 1fr; max-width: 360px; margin-left: auto; margin-right: auto; }
            header h1 { font-size: 32px; }
        }

        /* ─── Book Card ─── */
        .book-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        .book-card:nth-child(1) { animation-delay: 0s; }
        .book-card:nth-child(2) { animation-delay: 0.08s; }
        .book-card:nth-child(3) { animation-delay: 0.16s; }

        .book-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--shadow-lg);
            background: var(--bg-card-hover);
            border-color: rgba(0, 0, 0, 0.08);
        }

        /* Cover */
        .book-cover-wrap {
            position: relative;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: linear-gradient(135deg, #e8e8ed 0%, #d2d2d7 100%);
        }

        .book-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .book-card:hover .book-cover {
            transform: scale(1.04);
        }

        .book-year {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            font-size: 11px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            letter-spacing: 0.04em;
        }

        /* Info */
        .book-info {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .book-title {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.29;
            letter-spacing: -0.01em;
            margin-bottom: 3px;
        }

        .book-author {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 10px;
        }

        .book-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .book-tag {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-tertiary);
            letter-spacing: 0.02em;
        }

        .book-description {
            font-size: 13px;
            color: var(--text-tertiary);
            line-height: 1.54;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 14px;
        }

        /* Format Indicators */
        .format-row {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
        }

        .format-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .format-pill.ebook {
            background: rgba(0, 113, 227, 0.08);
            color: #0071e3;
        }

        .format-pill.print {
            background: rgba(255, 149, 0, 0.08);
            color: #c93400;
        }

        .format-pill .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }

        .format-pill.ebook .dot { background: #34c759; }
        .format-pill.print .dot { background: #ff9500; }

        /* Action Buttons */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-row {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            flex: 1;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn.primary {
            background: var(--accent);
            color: white;
        }

        .action-btn.primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.3);
        }

        .action-btn.secondary {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-primary);
        }

        .action-btn.secondary:hover {
            background: rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        .action-btn.buy {
            background: rgba(52, 199, 89, 0.08);
            color: #248a3d;
        }

        .action-btn.buy:hover {
            background: rgba(52, 199, 89, 0.14);
            transform: translateY(-1px);
        }

        .action-icon {
            font-size: 14px;
            line-height: 1;
        }

        /* ─── Shuffle Button ─── */
        .shuffle-container {
            text-align: center;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        .shuffle-btn {
            padding: 14px 44px;
            font-size: 17px;
            font-weight: 500;
            background: var(--text-primary);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            letter-spacing: -0.01em;
            position: relative;
        }

        .shuffle-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
        }

        .shuffle-btn:active {
            transform: scale(0.97);
            transition-duration: 0.1s;
        }

        /* ─── Footer ─── */
        footer {
            text-align: center;
            margin-top: 56px;
            padding-top: 28px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 2;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .footer-sources {
            font-weight: 500;
            color: var(--text-tertiary);
        }

        /* ─── Empty State ─── */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .empty-state h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 15px;
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #e8e8ed 25%, #f0f0f3 50%, #e8e8ed 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: var(--radius-lg);
        }

        .skeleton-card {
            aspect-ratio: 2 / 4.2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Find Your Next Read</h1>
            <p>Critically acclaimed books available now at Brooklyn Public Library</p>
            <a href="audiobooks.html" class="audiobook-link">
                <span>Audiobooks</span>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 2.5L8 6L4.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </header>

        <div class="filter-bar" id="filterBar">
            <button class="filter-chip active" data-genre="">All</button>
            <button class="filter-chip" data-genre="fiction">Fiction</button>
            <button class="filter-chip" data-genre="nonfiction">Nonfiction</button>
            <button class="filter-chip" data-genre="biography & memoir">Memoir</button>
            <button class="filter-chip" data-genre="mysteries & thrillers">Mysteries</button>
            <button class="filter-chip" data-genre="sci fi, fantasy & speculative fiction">Sci-Fi</button>
            <button class="filter-chip" data-genre="historical fiction">Historical</button>
            <button class="filter-chip" data-genre="love & romance">Romance</button>
        </div>

        <p class="book-count" id="bookCount"></p>

        <div class="book-grid" id="bookGrid">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>

        <div class="shuffle-container">
            <button class="shuffle-btn" onclick="shuffle()">Show Me More</button>
        </div>

        <footer>
            <p class="footer-sources">NPR Books We Love &middot; Modern Library &middot; Library Journal &middot; NYT Notable Books</p>
            <p>Borrow from <a href="https://www.bklynlibrary.org/" target="_blank" id="libraryLink">Brooklyn Public Library</a> &middot; Buy used on <a href="https://www.thriftbooks.com/" target="_blank">Thriftbooks</a></p>
            <p id="lastChecked"></p>
        </footer>
    </div>

    <script src="library-config.js"></script>
    <script>
        // Footer library link comes from library-config.js
        const libraryLink = document.getElementById('libraryLink');
        if (libraryLink) {
            libraryLink.href = LIBRARY.homepage;
            libraryLink.textContent = LIBRARY.name;
        }

        let availableBooks = [];
        let currentBooks = [];
        let seenBooks = new Set();
        let activeGenre = '';

        async function init() {
            try {
                const response = await fetch('available-books.json');
                availableBooks = await response.json();
                console.log(`Loaded ${availableBooks.length} available books`);
                updateCount();
                shuffle();

                try {
                    const checkResponse = await fetch('last-checked.json');
                    const checkData = await checkResponse.json();
                    if (checkData.lastChecked) {
                        const date = new Date(checkData.lastChecked);
                        const formatted = date.toLocaleDateString('en-US', {
                            month: 'short', day: 'numeric', year: 'numeric',
                            hour: 'numeric', minute: '2-digit'
                        });
                        document.getElementById('lastChecked').textContent = `Last checked ${formatted}`;
                    }
                } catch (e) {}
            } catch (e) {
                console.error('Error loading books:', e);
                document.getElementById('bookGrid').innerHTML = `
                    <div class="empty-state">
                        <h3>Couldn't load books</h3>
                        <p>Make sure available-books.json exists</p>
                    </div>
                `;
            }
        }

        function updateCount() {
            const filtered = getFilteredBooks();
            const el = document.getElementById('bookCount');
            el.textContent = `${filtered.length} books available`;
        }

        function getFilteredBooks() {
            if (!activeGenre) return availableBooks;
            return availableBooks.filter(book => {
                const tags = (book.tags || []).map(t => t.toLowerCase());
                return tags.includes(activeGenre);
            });
        }

        function shuffle() {
            const filtered = getFilteredBooks();

            let unseen = filtered.filter(b => !seenBooks.has(b.title));
            if (unseen.length < 3) {
                seenBooks.clear();
                unseen = filtered;
            }

            const shuffled = unseen.sort(() => Math.random() - 0.5);
            currentBooks = shuffled.slice(0, 3);
            currentBooks.forEach(b => seenBooks.add(b.title));

            renderBooks();
        }

        function getFormats(book) {
            const formats = [];
            if (book.formats?.ebook || book.ebookAvailable) {
                const copies = book.ebookCopies || book.availableCopies || 0;
                const label = book.alwaysAvailable ? 'eBook · always available'
                    : copies > 0 ? `eBook · ${copies} available` : 'eBook';
                formats.push({ type: 'ebook', label });
            }
            if (book.formats?.print || book.printAvailable) {
                const copies = book.printCopies || 0;
                formats.push({ type: 'print', label: copies > 0 ? `Print · ${copies} available` : 'Print' });
            }
            if (formats.length === 0) {
                formats.push({ type: 'ebook', label: 'eBook' });
            }
            return formats;
        }

        function getCoverUrl(book) {
            const isbn = book.cover || book.isbn;
            const year = book.year || '2025';
            return `https://apps.npr.org/best-books/assets/synced/covers/${year}/${isbn}.jpg`;
        }

        function getPlaceholderCover(title) {
            const words = title.split(' ');
            const lines = [];
            let currentLine = '';
            for (const word of words) {
                if ((currentLine + ' ' + word).trim().length <= 16) {
                    currentLine = (currentLine + ' ' + word).trim();
                } else {
                    if (currentLine) lines.push(currentLine);
                    currentLine = word;
                }
            }
            if (currentLine) lines.push(currentLine);
            const displayLines = lines.slice(0, 4);
            if (lines.length > 4) displayLines[3] += '…';
            const lineHeight = 26;
            const startY = 150 - (displayLines.length * lineHeight / 2);
            const textElements = displayLines.map((line, i) =>
                `<text x="100" y="${startY + i * lineHeight}" text-anchor="middle" fill="%231d1d1f" font-size="15" font-weight="600" font-family="-apple-system, system-ui, sans-serif">${line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;')}</text>`
            ).join('');
            return `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%23f0f0f3"/><stop offset="100%" stop-color="%23e4e4e8"/></linearGradient></defs><rect fill="url(%23g)" width="200" height="300" rx="4"/>${textElements}</svg>`;
        }

        function getThriftbooksUrl(book) {
            const query = `${book.title} by ${book.author || ''}`.trim();
            return `https://www.thriftbooks.com/browse/?b.search=${encodeURIComponent(query)}#b.s=mostPopular-desc&b.p=1&b.pp=50&b.oos&b.tile`;
        }

        // eBooks link to the exact OverDrive title page when the record has an overdriveId,
        // otherwise to a title search
        function getBorrowUrl(book, format = 'ebook') {
            if (format === 'print') {
                return LIBRARY.catalogSearchUrl(book.title);
            }
            if (book.borrowUrl) return book.borrowUrl;
            return LIBRARY.overdriveBorrowUrl({ title: book.title, overdriveId: book.overdriveId });
        }

        function cleanDescription(desc) {
            if (!desc) return '';
            return desc.replace(/<[^>]*>/g, '').replace(/&[^;]+;/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function getDisplayTags(book) {
            const skip = new Set(['fiction', 'nonfiction', 'staff picks']);
            return (book.tags || []).filter(t => !skip.has(t.toLowerCase())).slice(0, 2);
        }

        function renderBooks() {
            const grid = document.getElementById('bookGrid');

            if (currentBooks.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No books found</h3>
                        <p>Try a different genre</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = currentBooks.map(book => {
                const formats = getFormats(book);
                const description = cleanDescription(book.description);
                const tags = getDisplayTags(book);
                const hasEbook = formats.some(f => f.type === 'ebook');
                const hasPrint = formats.some(f => f.type === 'print');

                return `
                    <div class="book-card">
                        <div class="book-cover-wrap">
                            <img class="book-cover"
                                 src="${getCoverUrl(book)}"
                                 alt="${book.title}"
                                 loading="lazy"
                                 data-title="${book.title.replace(/"/g, '&quot;')}"
                                 onerror="this.onerror=null; this.src=getPlaceholderCover(this.dataset.title)">
                            ${book.year ? `<span class="book-year">${book.year}</span>` : ''}
                        </div>
                        <div class="book-info">
                            <h3 class="book-title">${book.title}</h3>
                            <p class="book-author">${book.author || 'Unknown'}</p>
                            ${tags.length ? `<div class="book-tags">${tags.map(t => `<span class="book-tag">${t}</span>`).join('')}</div>` : ''}
                            ${description ? `<p class="book-description">${description}</p>` : ''}
                            <div class="format-row">
                                ${formats.map(f => `
                                    <span class="format-pill ${f.type}">
                                        <span class="dot"></span>
                                        ${f.label}
                                    </span>
                                `).join('')}
                            </div>
                            <div class="actions">
                                <div class="action-row">
                                    ${hasEbook ? `<a class="action-btn primary" href="${getBorrowUrl(book, 'ebook')}" target="_blank">
                                        <span class="action-icon">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg>
                                        </span>
                                        Borrow eBook
                                    </a>` : ''}
                                    ${hasPrint ? `<a class="action-btn secondary" href="${getBorrowUrl(book, 'print')}" target="_blank">
                                        <span class="action-icon">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
                                        </span>
                                        Borrow Print
                                    </a>` : `<a class="action-btn secondary" href="${getBorrowUrl(book, 'print')}" target="_blank">
                                        <span class="action-icon">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
                                        </span>
                                        Check Print
                                    </a>`}
                                </div>
                                <a class="action-btn buy" href="${getThriftbooksUrl(book)}" target="_blank">
                                    <span class="action-icon">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
                                    </span>
                                    Buy Used on Thriftbooks
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter chips
        document.getElementById('filterBar').addEventListener('click', (e) => {
            const chip = e.target.closest('.filter-chip');
            if (!chip) return;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            activeGenre = chip.dataset.genre;
            seenBooks.clear();
            updateCount();
            shuffle();
        });

        init();
    </script>
</body>
</html>
